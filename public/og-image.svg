<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="gradient-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
    <radialGradient id="glow-cyan" cx="15%" cy="50%" r="25%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0)" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="30%" r="25%">
      <stop offset="0%" stop-color="rgba(138, 43, 226, 0.15)" />
      <stop offset="100%" stop-color="rgba(138, 43, 226, 0)" />
    </radialGradient>
  </defs>

  <!-- Solid Background -->
  <rect width="1200" height="630" fill="#0a0a0c" />
  
  <!-- Subtle Glowing Accents -->
  <rect width="1200" height="630" fill="url(#glow-cyan)" />
  <rect width="1200" height="630" fill="url(#glow-purple)" />

  <!-- App Logo / Title -->
  <text 
    x="600" 
    y="315" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="120" 
    font-weight="800" 
    text-anchor="middle" 
    fill="url(#gradient-glow)">
    P2Pear
  </text>

  <!-- Tagline -->
  <text 
    x="600" 
    y="400" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="32" 
    font-weight="400" 
    text-anchor="middle" 
    fill="#a1a1aa">
    Share files and connect with anyone. Fast, safe, and simple.
  </text>
  
  <!-- Encrypted lock badge -->
  <g transform="translate(480, 480)">
    <rect width="240" height="48" rx="24" fill="rgba(255,255,255,0.05)" />
    <!-- Lock Icon (centered vertically, left side) -->
    <g transform="translate(35, 14)" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </g>
    <!-- Text (aligned next to lock) -->
    <text x="65" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#71717a" text-anchor="start">End-to-end encrypted</text>
  </g>
</svg>
